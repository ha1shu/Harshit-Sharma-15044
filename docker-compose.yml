version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: multiplex-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multiplex}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - multiplex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-multiplex}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: multiplex-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@host.docker.internal:5432/multiplex}
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m alembic upgrade head && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    image: nginx:alpine
    container_name: multiplex-web
    ports:
      - "8080:80"
    volumes:
      - ./backend/app/static:/usr/share/nginx/html:ro

volumes:
  multiplex_pgdata:
